[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motorguard-ai"
version = "1.1.0"
description = "Vehicle insurance customer churn prediction with ML, MLflow and FastAPI"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
